[workspace]
resolver = "2"
members = [
    "crates/faerie-core",
    "crates/faerie-net",
    "crates/faerie-minecraft",
    "crates/faerie-instances",
    "crates/faerie-modding",
    "crates/faerie-auth",
    "crates/test-support",
    "apps/launcher",
]

[workspace.package]
version = "0.7.2"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
faerie-core = { path = "crates/faerie-core" }
faerie-net = { path = "crates/faerie-net" }
faerie-minecraft = { path = "crates/faerie-minecraft" }
faerie-instances = { path = "crates/faerie-instances" }
faerie-modding = { path = "crates/faerie-modding" }
faerie-auth = { path = "crates/faerie-auth" }
test-support = { path = "crates/test-support" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
    "net",
    "io-util",
    "process",
] }
tokio-util = "0.7"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "registry"] }
tracing-appender = "0.2"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "http2",
    "json",
    "gzip",
] }
sha1 = "0.10"
sysinfo = "0.33"
tempfile = "3"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
